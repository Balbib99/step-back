# The same container, to try on a computer: no Caddy, no password, reachable only from this
# machine at http://127.0.0.1:3000.
#
#   docker compose -f deploy/compose.local.yaml up --build
#
# Do not use this on the Raspberry Pi: it has no authentication.

name: step-back-local

services:
  step-back:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: step-back:local
    env_file:
      - path: production.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      DB_PATH: /data/step-back.db
      WEB_DIR: /app/web
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - data:/data
    ports:
      - '127.0.0.1:3000:3000'
    mem_limit: 400m
    # Nothing is written outside /data (the volume) and /tmp (memory): an update replaces the
    # image, and a mistake or an intruder cannot change the program.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  data:
